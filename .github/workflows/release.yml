name: Release

# A `v*` tag on `main` publishes `versioncam` to npm — from here, never from a
# laptop. npm authorises it by trusted publishing: the package's settings on
# npmjs.com name this repository and this file, and the job proves who it is
# with a short-lived OIDC token, so no npm token exists anywhere to leak.
# npm also requires the package's `repository.url` to name this repository;
# without it the publish is refused with a 404 that gives no reason.
#
# No provenance attestation: npm generates none for a private repository, and
# one would point at a source nobody outside can open.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the check below can see `main`.
          fetch-depth: 0

      # A tag on some other branch's commit would publish that branch.
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # No dependency cache: what is published is built from what the
      # lockfile names, fetched fresh.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1 && npm --version

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx versioncam install --with-deps
      - run: npm run test:integration

      # The tag is the version, or nothing is published.
      - name: The tag matches the package's version
        run: |
          version="v$(node -p "require('./packages/recorder/package.json').version")"
          test "$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME, but packages/recorder is $version." >&2
            exit 1
          }

      # While npm/cli#9969 stands, a release is published by hand from main
      # and tagged afterwards. The tag's run then finds the version already on
      # npm and stops here, green, having run every gate on the tagged commit.
      - name: Is this version already on npm?
        id: npm
        run: |
          version="$(node -p "require('./packages/recorder/package.json').version")"
          if npm view "versioncam@$version" version > /dev/null 2>&1; then
            echo "versioncam@$version is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # A trusted publish npm refuses fails with a bare 404. The verbose log
      # says why, on the lines that begin `npm verbose oidc`.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish -w versioncam --access public --provenance=false --loglevel verbose

      # version.cam's docs are built from the package as npm has it. The site
      # is a Worker that its own repository redeploys every morning, so a
      # release reaches the docs within a day with nothing to call from here.
