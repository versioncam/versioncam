name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ffmpeg encodes; ffprobe checks what was encoded. ffmpeg-static ships
      # only the former, so the system package is what CI uses.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npx versioncam install --with-deps
      - run: npm run test:integration

      # The example app is the proof that the package works from outside
      # itself: a separate workspace, consuming it by name, with its own config.
      # Nothing starts it first. `check` and the gate test each start it from
      # the config's `webServer` and stop it again — and with CI set, a server
      # already on the port would be refused rather than trusted.
      - name: Check the example's clips still match it
        working-directory: examples/demo-app
        # bash, so pipefail holds: a failing check still fails the job through
        # the tee. Its output is kept, and published beside the clips below.
        shell: bash
        run: |
          mkdir -p .versioncam
          npx versioncam check 2>&1 | tee .versioncam/check.txt

      # The gate decides not to take screenshots. This is the check that it
      # never changes what the recording shows — on a real app, not a fixture —
      # and, beside it, that the app records the same way twice at all, which
      # the gate's check depends on.
      - name: The gate changes nothing, and the app is stable
        working-directory: examples/demo-app
        run: npm run test:gate

      # When two recordings differ, the tests attach the pictures behind the
      # first differing frame, and the stability runs are kept whole — two
      # timelines and their states, enough to compare any frame. On a runner
      # nobody can log into, that is the only way to see what differed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-test-results
          path: |
            examples/demo-app/test-results
            examples/demo-app/.versioncam/recordings/__stability
          if-no-files-found: ignore

      - name: Render the example's clips
        working-directory: examples/demo-app
        run: npx versioncam render --sequence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-demos
          path: examples/demo-app/.versioncam/out
          if-no-files-found: warn

      # The front page of version.cam plays these renders, so what it shows is
      # what `main` records — re-rendered on every push, never by hand. This is
      # the hosted service's `publish` in miniature, used before it exists.
      # Skipped until the R2 secrets are in this repository's settings.
      - name: Publish the example's renders to clips.version.cam
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "No R2 secrets in this repository yet; nothing published."
            exit 0
          fi
          R2="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # The top-level renders only; the sheets' tile directories stay out.
          aws s3 sync examples/demo-app/.versioncam/out "s3://versioncam-clips/example" \
            --endpoint-url "$R2" \
            --exclude "*" --include "*.mp4" --include "*.webm" --include "*.png" \
            --exclude "*/*" \
            --cache-control "public, max-age=300"

          # What the front page needs to show a take truthfully, beside its
          # video: the script that recorded it, the recording's own timeline
          # (its steps, and the version that made it), and this run's check.
          # The manifest goes last, so it never names a file not yet there.
          node .github/scripts/take-manifest.mjs examples/demo-app take
          aws s3 cp take "s3://versioncam-clips/example" --recursive \
            --endpoint-url "$R2" --exclude "*" --include "*.timeline.json" \
            --content-type "application/json" --cache-control "public, max-age=300"
          aws s3 cp take "s3://versioncam-clips/example" --recursive \
            --endpoint-url "$R2" --exclude "*" --include "*.clip.ts" --include "check.txt" \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 cp take/manifest.json "s3://versioncam-clips/example/manifest.json" \
            --endpoint-url "$R2" \
            --content-type "application/json" --cache-control "public, max-age=300"
