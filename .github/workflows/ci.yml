name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ffmpeg encodes; ffprobe checks what was encoded. ffmpeg-static ships
      # only the former, so the system package is what CI uses.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration

      # The example app is the proof that the package works from outside
      # itself: a separate workspace, consuming it by name, with its own config.
      - name: Start the example app
        run: |
          npm run dev -w examples/demo-app &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5174/ && exit 0
            sleep 1
          done
          echo "the example app did not start" >&2
          exit 1

      - name: Check the example's clips still match it
        working-directory: examples/demo-app
        run: npx versioncam check

      # The gate decides not to take screenshots. This is the check that it
      # never changes what the recording shows — on a real app, not a fixture.
      - name: The gate changes nothing
        working-directory: examples/demo-app
        run: npm run test:gate

      - name: Render the example's clips
        working-directory: examples/demo-app
        run: npx versioncam render --sequence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-demos
          path: examples/demo-app/.versioncam/out
          if-no-files-found: warn
