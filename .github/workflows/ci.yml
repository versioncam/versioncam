name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and no job holds a credential for
# anything but the one upload it does. The jobs that hold anything get it
# alone: `publish` may ask GitHub for an OIDC token, and `site-clips`
# receives the R2 keys. The build job, which installs and runs every
# dependency, has neither: it hands them what they need as artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the job's token is not left in .git for
          # the dependencies to find.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # ffmpeg encodes; ffprobe checks what was encoded. ffmpeg-static ships
      # only the former, so the system package is what CI uses.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npx versioncam install --with-deps
      - run: npm run test:integration

      # The example app is the proof that the package works from outside
      # itself: a separate workspace, consuming it by name, with its own config.
      # Nothing starts it first. `check` and the gate test each start it from
      # the config's `webServer` and stop it again — and with CI set, a server
      # already on the port would be refused rather than trusted.
      - name: Check the example's clips still match it
        working-directory: examples/demo-app
        # bash, so pipefail holds: a failing check still fails the job through
        # the tee. Its output is kept, and published beside the clips below.
        shell: bash
        run: |
          mkdir -p .versioncam
          npx versioncam check 2>&1 | tee .versioncam/check.txt

      # The gate decides not to take screenshots. This is the check that it
      # never changes what the recording shows — on a real app, not a fixture —
      # and, beside it, that the app records the same way twice at all, which
      # the gate's check depends on.
      - name: The gate changes nothing, and the app is stable
        working-directory: examples/demo-app
        run: npm run test:gate

      # When two recordings differ, the tests attach the pictures behind the
      # first differing frame, and the stability runs are kept whole — two
      # timelines and their states, enough to compare any frame. On a runner
      # nobody can log into, that is the only way to see what differed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: example-test-results
          path: |
            examples/demo-app/test-results
            examples/demo-app/.versioncam/recordings/__stability
          if-no-files-found: ignore

      - name: Render the example's clips
        working-directory: examples/demo-app
        run: npx versioncam render --sequence

      # The renders, for anyone to look at, and for `site-clips` to upload.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: example-demos
          path: examples/demo-app/.versioncam/out
          if-no-files-found: warn

      # What the front page shows beside each take (its script, its timeline
      # and this run's check), gathered here, where the checkout and the
      # recordings are, so that `site-clips` runs nothing but the upload.
      - name: Gather the example's take for version.cam's front page
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node .github/scripts/take-manifest.mjs examples/demo-app take

      # Handed to the jobs below, for this run only. The recordings are the
      # clips `check` just made, without the stability and gate runs kept
      # under `__` directories, which `publish` never reads; the recorder's
      # build is what the Action runs as this repository's versioncam.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: example-take
          path: take
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: example-recordings
          path: |
            examples/demo-app/.versioncam/recordings
            !examples/demo-app/.versioncam/recordings/__*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: recorder-dist
          path: packages/recorder/dist
          if-no-files-found: error
          retention-days: 1

  # version.cam's own publish, used on this repository first: the recordings
  # the build job's `check` made, sent to production by the versioncam Action,
  # as a customer's workflow sends them, with GitHub's token for this run.
  # The only job that may ask for that token, so it runs no dependency's
  # code: it installs them without their scripts, and runs nothing it built.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # id-token: the Action asks GitHub for a token that names this repository
    # and commit, which is how version.cam knows who is publishing without a
    # stored secret. Naming one permission removes the defaults, so
    # contents: read is stated too.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The packages, linked as npm links them, and none of their install
      # scripts: `publish` needs no browser and no ffmpeg, and no package's
      # script runs where the OIDC token can be asked for.
      - run: npm ci --ignore-scripts

      # Into place as the build job left them: the Action runs the nearest
      # `node_modules/.bin/versioncam` above the example app, the root's,
      # linked to packages/recorder, whose launcher needs its dist; and
      # `publish` reads the recordings directory.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recorder-dist
          path: packages/recorder/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: example-recordings
          path: examples/demo-app/.versioncam/recordings

      - name: Publish the example's recordings to version.cam
        uses: versioncam/action@v1
        with:
          mode: publish
          working-directory: examples/demo-app

  # The front page of version.cam plays these renders, so what it shows is
  # what `main` records — re-rendered on every push, never by hand. The only
  # job that receives the R2 keys, scoped to that bucket, and it runs nothing
  # but the AWS CLI on what the build job made: no checkout, no npm, no
  # dependency's code. Skipped until the R2 secrets are in this repository's
  # settings.
  site-clips:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Artifacts of this run download with the run's own credentials; the
    # job's token is needed for nothing.
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: example-demos
          path: examples/demo-app/.versioncam/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: example-take
          path: take

      - name: Publish the example's renders to clips.version.cam
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "No R2 secrets in this repository yet; nothing published."
            exit 0
          fi
          R2="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # The top-level renders only; the sheets' tile directories stay out.
          aws s3 sync examples/demo-app/.versioncam/out "s3://versioncam-clips/example" \
            --endpoint-url "$R2" \
            --exclude "*" --include "*.mp4" --include "*.webm" --include "*.png" \
            --exclude "*/*" \
            --cache-control "public, max-age=300"

          # What the front page needs to show a take truthfully, beside its
          # video: the script that recorded it, the recording's own timeline
          # (its steps, and the version that made it), and this run's check,
          # gathered by the build job. The manifest goes last, so it never
          # names a file not yet there.
          aws s3 cp take "s3://versioncam-clips/example" --recursive \
            --endpoint-url "$R2" --exclude "*" --include "*.timeline.json" \
            --content-type "application/json" --cache-control "public, max-age=300"
          aws s3 cp take "s3://versioncam-clips/example" --recursive \
            --endpoint-url "$R2" --exclude "*" --include "*.clip.ts" --include "check.txt" \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 cp take/manifest.json "s3://versioncam-clips/example/manifest.json" \
            --endpoint-url "$R2" \
            --content-type "application/json" --cache-control "public, max-age=300"
