<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scrolling fixture</title>
    <style>
      /* Smooth scrolling everywhere, on purpose: the page and the pane both
         ask for it, so a test passes only if a scroll lands where it was
         sent in spite of that. Rows are numbered and striped so that every
         offset of the pane is a different picture, and they light up under
         the cursor, so a scroll beneath a parked cursor changes what it
         hovers. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #pane {
        position: absolute;
        top: 80px;
        left: 80px;
        width: 400px;
        height: 300px;
        overflow: auto;
        border: 4px solid #333333;
        scroll-behavior: smooth;
      }
      #pane .row {
        height: 30px;
        line-height: 30px;
        padding-left: 12px;
        font-size: 16px;
        color: #111111;
      }
      #pane .row:nth-child(odd) {
        background: #e8eef8;
      }
      #pane .row:hover {
        background: #ffd75e;
      }
      #still {
        position: absolute;
        top: 80px;
        left: 540px;
        width: 200px;
        height: 120px;
        overflow: auto;
        border: 4px solid #999999;
      }
      #jump {
        position: absolute;
        top: 420px;
        left: 80px;
        width: 160px;
        height: 40px;
        appearance: none;
        border: none;
        border-radius: 0;
        background: #dddddd;
        color: #111111;
        font-size: 14px;
      }
      #page {
        position: absolute;
        top: 500px;
        left: 0;
        width: 100%;
      }
      #page .line {
        height: 60px;
        line-height: 60px;
        padding-left: 80px;
        font-size: 20px;
        color: #222222;
      }
      #page .line:nth-child(even) {
        background: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <div id="pane" data-testid="pane"></div>
    <div id="still" data-testid="still">Nothing here overflows.</div>
    <button id="jump" data-testid="jump">Jump to row 30</button>
    <div id="page"></div>
    <script>
      const pane = document.getElementById("pane");
      for (let i = 1; i <= 40; i += 1) {
        const row = document.createElement("div");
        row.className = "row";
        row.dataset.testid = `row-${i}`;
        row.textContent = `Row ${i}`;
        pane.appendChild(row);
      }
      const page = document.getElementById("page");
      for (let i = 1; i <= 40; i += 1) {
        const line = document.createElement("div");
        line.className = "line";
        line.textContent = `Line ${i}`;
        page.appendChild(line);
      }
      // What a chat does to keep its newest message in view: a script's own
      // smooth scroll, which the stylesheet cannot turn off.
      document.getElementById("jump").addEventListener("click", () => {
        document
          .querySelector('[data-testid="row-30"]')
          .scrollIntoView({ behavior: "smooth", block: "start" });
      });
    </script>
  </body>
</html>
