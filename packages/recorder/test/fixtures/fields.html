<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Somewhere to type</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }
      input,
      textarea,
      select {
        position: absolute;
        font-size: 16px;
        border: 1px solid #999999;
      }
      /* Fixed positions and sizes: the inventory reports geometry and the test
         asserts these exact numbers. */
      #recipient {
        left: 40px;
        top: 40px;
        width: 300px;
        height: 36px;
      }
      #notes {
        left: 40px;
        top: 120px;
        width: 300px;
        height: 80px;
      }
      #route {
        left: 40px;
        top: 240px;
        width: 200px;
        height: 32px;
      }
      /* One field or control per way a name can be given, for the inventory
         to say which it was. Laid out below the three above, which keep their
         exact geometry. */
      label,
      p,
      button {
        position: absolute;
        font-size: 16px;
      }
      #city-label {
        left: 400px;
        top: 40px;
      }
      #city {
        left: 460px;
        top: 40px;
        width: 200px;
        height: 32px;
      }
      #speed-label {
        left: 400px;
        top: 120px;
      }
      #speed {
        left: 460px;
        top: 120px;
        width: 120px;
        height: 32px;
      }
      #reference {
        left: 400px;
        top: 240px;
        width: 200px;
        height: 32px;
      }
      #close {
        left: 700px;
        top: 40px;
        width: 40px;
        height: 40px;
      }
      #status {
        left: 400px;
        top: 320px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <input
      id="recipient"
      data-testid="recipient"
      aria-label="Recipient"
      type="text"
    />
    <textarea id="notes" data-testid="notes" placeholder="Notes"></textarea>
    <select id="route" data-testid="route" aria-label="Route">
      <option>Overnight</option>
      <option>Standard</option>
    </select>

    <label id="city-label" for="city">City</label>
    <input id="city" data-testid="city" type="text" />
    <label id="speed-label"
      >Speed
      <select id="speed" data-testid="speed">
        <option>Fast</option>
        <option>Slow</option>
      </select></label
    >
    <input
      id="reference"
      data-testid="reference"
      name="reference"
      type="text"
    />
    <button
      id="close"
      data-testid="close"
      type="button"
      aria-label="Close dialog"
    >
      ×
    </button>
    <p id="status" data-testid="status">
      1 of 12
      <span>shipments match</span>
    </p>
  </body>
</html>
