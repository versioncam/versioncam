<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dropzone fixture</title>
    <style>
      /* A dropzone as an upload page has one: it takes files only from a
         drop, through the same events a real drag sends, and lists them. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        color: #111111;
      }
      #zone {
        position: absolute;
        top: 60px;
        left: 60px;
        width: 400px;
        height: 240px;
        border: 3px dashed #999999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      #zone.over {
        border-color: #2f6fde;
        background: #eef3fd;
      }
      #files {
        position: absolute;
        top: 330px;
        left: 60px;
        font-size: 18px;
        line-height: 28px;
      }
      .box {
        position: absolute;
        top: 560px;
        width: 120px;
        height: 80px;
        background: #dddddd;
      }
    </style>
  </head>
  <body>
    <div id="zone" data-testid="zone">Drop files here</div>
    <div id="files" data-testid="files"></div>
    <div class="box" id="a" data-testid="a" style="left: 60px"></div>
    <div class="box" id="b" data-testid="b" style="left: 340px"></div>
    <script>
      const zone = document.getElementById("zone");
      zone.addEventListener("dragenter", (e) => {
        e.preventDefault();
        zone.classList.add("over");
      });
      zone.addEventListener("dragover", (e) => e.preventDefault());
      zone.addEventListener("dragleave", () => zone.classList.remove("over"));
      zone.addEventListener("drop", async (e) => {
        e.preventDefault();
        zone.classList.remove("over");
        const list = document.getElementById("files");
        for (const file of e.dataTransfer.files) {
          const line = document.createElement("div");
          line.textContent = `${file.name} (${file.type}): ${await file.text()}`;
          list.appendChild(line);
        }
      });
      // Where a press began and ended, for the drag from one box to another.
      window.presses = [];
      document.addEventListener("mousedown", (e) =>
        window.presses.push(`down ${e.target.id}`),
      );
      document.addEventListener("mouseup", (e) =>
        window.presses.push(`up ${e.target.id}`),
      );
    </script>
  </body>
</html>
