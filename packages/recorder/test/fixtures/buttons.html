<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recorder fixture</title>
    <style>
      /* Everything here is deliberately static and flat-coloured: the driver
         and render integration tests assert on exact pixel values, so any
         gradient, shadow, transition or web font would make them fragile. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #target {
        position: absolute;
        left: 400px;
        top: 300px;
        width: 240px;
        height: 80px;
        border: none;
        border-radius: 0;
        background: #0000ff;
        color: #ffffff;
        font-size: 20px;
        line-height: 80px;
        text-align: center;
        cursor: default;
      }
      /* Hover and active are the states the driver test proves it reached:
         a synthetic cursor drawn in post could never produce them. */
      #target:hover {
        background: #ff0000;
      }
      #target:active {
        background: #00aa00;
      }
      #readout {
        position: absolute;
        left: 400px;
        top: 200px;
        width: 240px;
        height: 40px;
        line-height: 40px;
        font-size: 18px;
        color: #111111;
      }
    </style>
  </head>
  <body>
    <div id="readout" data-testid="readout">clicks: 0</div>
    <button id="target" data-testid="target" type="button">Press me</button>
    <script>
      let clicks = 0;
      const readout = document.getElementById("readout");
      document.getElementById("target").addEventListener("click", () => {
        clicks += 1;
        readout.textContent = "clicks: " + clicks;
      });
    </script>
  </body>
</html>
