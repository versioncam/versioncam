<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Two of the same words</title>
    <style>
      /* The shape of the page a pilot hit: a destination named in a row and
         named again in the status line above it, so `byText` resolves to two
         elements and Playwright refuses to guess. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #status {
        position: absolute;
        left: 40px;
        top: 40px;
        font-size: 18px;
        color: #111111;
      }
      table {
        position: absolute;
        left: 40px;
        top: 120px;
        border-collapse: collapse;
        font-size: 18px;
      }
      td,
      th {
        padding: 8px 24px;
        border: 1px solid #cccccc;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="status" data-testid="status">Nairobi</div>
    <table data-testid="shipments">
      <tr>
        <th>Destination</th>
        <th>Status</th>
      </tr>
      <tr>
        <td data-testid="row-destination">Nairobi</td>
        <td>In transit</td>
      </tr>
    </table>
  </body>
</html>
